<div id="main-container">
  <div id="dataset-container">
    <table id="dataset-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Title</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody><tr><td>Loading...</td></tr>
      </tbody>
    </table>

</div>
