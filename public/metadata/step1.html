<div id="main-container">
  <div id="table-of-contents-container">
    <h2>Eurostat Database</h2>
    <input
      type="text"
      id="searchBox"
      placeholder="Search for files (min 3 characters)..."
    />
    <div id="table-of-contents">Loading...</div>
  </div>
  <div id="dataset-container">
    <h2>Selected datasets</h2>
    <table id="dataset-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Title</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody><tr><td>Loading...</td></tr></tbody>
    </table>
  </div>
  <button id="backBtn" class="button-main bottom-left">← Back</button>
  <button id="nextBtn" class="button-main bottom-right hidden">Next →</button>
</div>
