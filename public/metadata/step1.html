<div id="main-container">
  <div id="tables-container">
    <h2>Eurostat Database</h2>
    <input
      type="text"
      id="searchBox"
      placeholder="Search for files (min 3 characters)..."
    />
    <div id="treeContainer">Loading...</div>
  </div>
  <div id="selected-tables-container">
    <h2>Selected tables</h2>
    <div id="selected-tables">
      <table id="selected-tables-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Title</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody><tr><td>Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
  <button id="backBtn" class="bottom-left">← Back</button>
  <button id="nextBtn" class="bottom-right hidden">Next →</button>
</div>
