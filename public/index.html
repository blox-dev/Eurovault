<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-type" content="text/html;charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Europe Vault</title>
    <link rel="shortcut icon" href="public/favicon.ico" />
    <script src="public/lib/d3.v7.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        height: 100vh;
        width: 100vw;
        overflow: hidden auto;
      }

      svg {
        display: block;
        margin: auto;
        background-color: white;
        width: 100%;
        height: 100%;
      }

      #map-container path:hover {
        cursor: pointer;
      }

      /* Layout containers */
      #main-container {
        display: grid;
        min-height: 100vh;
        min-width: 100vw;
      }

      #map-container {
        position: relative;
        overflow: hidden;
        grid-area: map;
      }

      #controls-container {
        grid-area: controls;
      }

      #chart-container {
        grid-area: chart;
        position: relative;
      }

      /* Tooltips */
      .chart-close-button {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 1;
        font-size: 1.1rem;
        padding: 2px 8px;
      }

      #chart-tooltip {
        position: absolute;
        z-index: 1;
        background: #fff;
        padding: 4px 8px;
        border: 1px solid #999;
        border-radius: 4px;
        font-size: 0.8rem;
        pointer-events: none;
        opacity: 0;
      }

      #map-tooltip {
        z-index: 1;
        position: absolute;
        pointer-events: none;
        background: #fff;
        border: 1px solid #ccc;
        padding: 5px;
        font-size: 0.8rem;
        border-radius: 4px;
        display: none;
      }

      #controls-tooltip {
        padding: 10px;
        border: 5px solid red;
        border-radius: 20px;
        margin-top: 10px;
      }

      /* Map info panel */
      #info-panel {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(255, 255, 255, 0.8);
        border-radius: 8px;
        padding: 5px;
        box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
        font-size: 0.9rem;
        max-width: 200px;
      }

      #info-title {
        font-weight: bold;
      }
      #info-description {
        margin-top: 4px;
      }
      #color-legend {
        margin-top: 10px;
      }
      #time-slider-container {
        margin-top: 12px;
      }

      /* Controls layout */
      #controls-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem;
        background-color: #f8f8f8;
        border: 1px solid #aaa;
        overflow: auto;
      }

      /* Control panel styling */
      .control-panel {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        padding: 1rem;
        margin: 0.2rem;
        border-radius: 8px;
        background: #ffffff;
        border: 1px solid #ccc;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      }

      .control-title {
        font-size: 1.1rem;
        font-weight: 600;
        color: #222;
        margin-bottom: 0.25rem;
      }

      .control-group {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }

      .control-group label {
        font-size: 0.8rem;
        color: #555;
      }

      .control-group select {
        max-width: 200px;
        width: 100%;
        padding: 0.3rem 0.5rem;
        font-size: 0.85rem;
        border: 1px solid #ccc;
        border-radius: 6px;
        background-color: #f9f9f9;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: border-color 0.2s ease;
      }

      .control-group select:focus {
        border-color: #4a90e2;
        outline: none;
        background-color: #fff;
      }

      .control-panel option {
        white-space: normal;
      }

      /* Responsive layouts */
      /* Desktop */
      @media (min-width: 768px) {
        #main-container {
          grid-template-columns: 60% 40%;
          grid-template-rows: 30% 70%;
          grid-template-areas:
            "map controls"
            "map chart";
        }

        #chart-container {
          overflow: hidden;
          display: block;
        }
      }

      /* Mobile */
      @media (max-width: 767px) {
        #main-container {
          grid-template-columns: 1fr;
          grid-template-rows: auto 1fr;
          grid-template-areas:
            "controls"
            "map";
        }

        #map-container {
          width: 100vw;
          height: 95vh;
        }

        #controls-container {
          overflow: auto;
        }

        #chart-container {
          display: none;
        }
      }

      /* Helper classes */
      .strike {
        text-decoration: line-through;
      }

      .noselect {
        -webkit-touch-callout: none; /* iOS Safari */
        -webkit-user-select: none; /* Safari */
        -khtml-user-select: none; /* Konqueror HTML */
        -moz-user-select: none; /* Old versions of Firefox */
        -ms-user-select: none; /* Internet Explorer/Edge */
        user-select: none; /* Non-prefixed version, currently
                              supported by Chrome, Edge, Opera and Firefox */
      }

      .hidden {
        display: none;
      }
    </style>
  </head>

  <body>
    <div id="chart-tooltip"></div>
    <div id="map-tooltip"></div>
    <!-- Main container -->
    <div id="main-container">
      <!-- Container for D3 Map -->
      <div id="map-container">
        <div id="info-panel">
          <div id="info-title"></div>
          <div id="info-description"></div>
          <div id="color-legend"></div>
          <div id="time-slider-container"></div>
        </div>
      </div>

      <!-- Container for controls -->
      <div id="controls-container">
        <!-- Dataset Panel -->
        <div id="dataset-panel" class="control-panel">
          <h2 class="control-title">Dataset</h2>
          <div class="control-group">
            <select id="dataset-select"></select>
          </div>
        </div>

        <!-- Filters Panel -->
        <div id="filter-panel" class="control-panel">
          <h2 class="control-title">Filters</h2>
        </div>
      </div>

      <!-- Container for charts -->
      <div id="chart-container">
        <div id="controls-tooltip">
          <p><b>Click</b> on a country to see more details</p>
          <p><b>Shift + Click</b> on countries to compare them</p>
        </div>
      </div>
    </div>

    <script>
      // Global variables
      let filteredData = []; // Current filtered dataset
      let selectedDataset = null; // Current metadata
      let chartedCountries = new Set(); // Stores selected countries for line chart
      let currentSelected = null; // Currently selected country geocode for bar chart

      // Permanent DOM elements
      let mainContainer = d3.select("#main-container");
      let mapContainer = d3.select("#map-container");
      let controlsContainer = d3.select("#controls-container");
      let chartContainer = d3.select("#chart-container");

      const colorPalette = d3.schemeBlues[6]; // 6-step blue

      const svg = mapContainer
        .append("svg")
        .attr("id", "map-svg")
        .attr("width", "100%")
        .attr("height", "100%");

      // get parent dimensions
      // const parent = svg.node().parentNode;
      // const width = parent.clientWidth;
      // const height = parent.clientHeight;
      // set SVG attributes
      // svg.attr("width", width).attr("height", height);

      const projection = d3.geoMercator();
      const pathGenerator = d3.geoPath().projection(projection);
      let europe;
      let width, height;

      // Add a group for the map
      const g = svg.append("g");

      function resizeMap() {
        const mapContainerBoundingRect = mapContainer
          .node()
          .getBoundingClientRect();
        width = mapContainerBoundingRect.width;
        height = mapContainerBoundingRect.height;

        const svg = d3.select("#map-svg");

        projection.fitSize([width, height], europe);

        svg.selectAll("path").attr("d", pathGenerator); // Reapply path with new projection
      }

      fetch("/public/europe.geojson")
        .then((response) => response.json())
        .then((geoJSON) => {
          europe = geoJSON;

          resizeMap();

          g.selectAll("path")
            .data(europe.features)
            .enter()
            .append("path")
            .attr("d", pathGenerator)
            .attr("fill", "#cccccc")
            .attr("stroke", "#333")
            .attr("stroke-width", 0.25);

          // only on desktop
          if (window.innerWidth > 768) {
            g.selectAll("path").on("click", function (event, d) {
              const geoCode = d.properties.EUROSTAT;

              if (event.shiftKey) {
                // Toggle country in chartedCountries
                if (
                  chartedCountries.has(geoCode) &&
                  chartedCountries.size > 1
                ) {
                  chartedCountries.delete(geoCode);
                } else {
                  chartedCountries.add(geoCode);
                }

                // Always include currentSelected if any
                if (
                  chartContainer.attr("data-chart-type") !== "line" &&
                  currentSelected &&
                  !chartedCountries.has(currentSelected)
                ) {
                  chartedCountries.add(currentSelected);
                }

                if (chartedCountries.size > 0) {
                  showLineChart(Array.from(chartedCountries));
                } else {
                  chartContainer.html("");
                }
              } else {
                // Normal click resets chartedCountries
                chartedCountries.clear();
                currentSelected = geoCode;
                showCountryChart(geoCode);
              }
            });
          }

          // --- Setup Zooming + Panning ---
          const zoom = d3
            .zoom()
            .scaleExtent([1, 10]) // min zoom 1x, max zoom 10x
            .translateExtent([
              [-100, -100],
              [width + 100, height + 100],
            ]) // allow limited panning
            .on("zoom", (event) => {
              g.attr("transform", event.transform);
            });

          svg.call(zoom);
        })
        .catch((error) => {
          console.error("Error fetching europe.geojson:", error);
        });

      // Global object to store all datasets
      let datasets = {};
      let metadata = {};
      const timeColorCache = {}; // Cache for time-based valuesByGeo

      function parseTime(t) {
        const match = t.match(/^(\d{4})(?:[-_]?([A-Za-z0-9]+))?$/);
        return match
          ? { year: +match[1], suffix: match[2] || "" }
          : { year: -Infinity, suffix: "" }; // fallback
      }

      function compareTimes(a, b) {
        const ta = parseTime(a);
        const tb = parseTime(b);
        if (ta.year !== tb.year) return ta.year - tb.year;
        return ta.suffix.localeCompare(tb.suffix);
      }

      // Fetch metadata
      fetch("/data/metadata.json")
        .then((response) => response.json())
        .then((data) => {
          metadata = data; // Store metadata in global variable
          console.log("Metadata loaded:", metadata);

          // Get all the dataset keys (e.g., 'SDG_08_10', 'EDUC_UOE_MOBS04', etc.)
          const datasetKeys = Object.keys(metadata);

          // For each key, load the corresponding CSV file
          const csvPromises = datasetKeys.map((key) => {
            const csvPath = `/data/files/${key}.csv`;
            return d3
              .csv(csvPath)
              .then((data) => {
                datasets[key] = data; // Store loaded CSV data into datasets object
              })
              .catch((error) => {
                console.error(`Error loading CSV for ${key}:`, error);
              });
          });

          // When all CSVs are loaded
          Promise.all(csvPromises).then(() => {
            console.log("All CSVs loaded:", datasets);
            setupControls(datasetKeys);
          });
        })
        .catch((error) => {
          console.error("Error fetching metadata:", error);
        });

      function setupControls(datasetKeys) {
        const datasetSelect = document.getElementById("dataset-select");
        const filterPanel = document.getElementById("filter-panel");

        // Populate dataset dropdown
        datasetKeys.forEach((key, index) => {
          const option = document.createElement("option");
          option.value = key;
          option.textContent = metadata[key].label;
          datasetSelect.appendChild(option);
        });

        // Set default selection
        datasetSelect.value = datasetKeys[0];
        updateFilters(datasetKeys[0]);

        // When dataset changes
        datasetSelect.addEventListener("change", (e) => {
          updateFilters(e.target.value);
        });

        function updateFilters(dataset) {
          const groupsToRemove = filterPanel.querySelectorAll(".control-group");

          groupsToRemove.forEach((group) => {
            filterPanel.removeChild(group);
          });

          selectedDataset = dataset;

          const params = metadata[selectedDataset].params || {};
          const values = metadata[selectedDataset].values || {};

          // Create dropdowns for each param
          Object.keys(values).forEach((param) => {
            const groupDiv = document.createElement("div");
            groupDiv.classList.add("control-group");

            const label = document.createElement("label");
            label.textContent = param;

            const select = document.createElement("select");
            select.id = `filter-${param}`;

            const options = Object.keys(values[param]);
            options.forEach((opt) => {
              const option = document.createElement("option");
              option.value = opt;
              option.textContent = values[param][opt];
              select.appendChild(option);
            });

            // If param is constrained in metadata.params, set default to first one
            if (params[param]) {
              select.value = params[param][0];
            } else {
              select.value = options[0];
            }

            // Add change event
            select.addEventListener("change", () => {
              for (const key in timeColorCache) {
                delete timeColorCache[key];
              }
              filterData(selectedDataset, (nochange = true));
            });

            groupDiv.appendChild(label);
            groupDiv.appendChild(select);
            filterPanel.appendChild(groupDiv);
          });

          // Initial filtering
          filterData(selectedDataset);
        }

        function filterData(selectedDataset, nochange = false) {
          let data = datasets[selectedDataset];

          const values = metadata[selectedDataset].values || {};
          let filters = {};

          // Gather selected filters
          Object.keys(values).forEach((param) => {
            const selected = document.getElementById(`filter-${param}`).value;
            filters[param.toUpperCase()] = selected; // CSV uses uppercase column names
          });

          // Filter the dataset
          filteredData = data.filter((row) => {
            return Object.keys(filters).every((param) => {
              return row[param] === filters[param];
            });
          });

          // console.log(`Filtered dataset for ${selectedDataset}:`, filteredData);
          updateMapColors(null, nochange);

          if (window.innerWidth <= 768) {
            return;
          }

          const chartType = chartContainer.attr("data-chart-type");
          if (chartType) {
            if (chartType == "bar") {
              const geoCode = currentSelected;
              if (geoCode) {
                showCountryChart(geoCode);
              }
            } else if (chartType == "line") {
              showLineChart(Array.from(chartedCountries));
            }
          }
        }

        function updateMapColors(selectedTime = null, nochange = false) {
          const timeChanged = selectedTime === null;
          // 1. Determine if TIME exists
          const hasTime = filteredData.length > 0 && "TIME" in filteredData[0];

          // 2. If so, find the latest year
          let latestTime = selectedTime;
          if (!selectedTime && hasTime) {
            let times = [...new Set(filteredData.map((d) => d.TIME))];
            times.sort(compareTimes);
            latestTime = times[times.length - 1];
          }

          let valuesByGeo = timeColorCache[latestTime];
          if (!valuesByGeo) {
            valuesByGeo = {};
            filteredData.forEach((row) => {
              const geo = row.GEO;
              if (!geo) return;
              if (!hasTime || row.TIME === latestTime) {
                const val = parseFloat(row.VALUE);
                valuesByGeo[geo] = val;
              }
            });
            timeColorCache[latestTime] = valuesByGeo; // Cache it
          }

          // 4. Compute min/max ignoring zeros
          const nonZeroValues = Object.values(valuesByGeo).filter((v) => v > 0);
          const minVal = d3.min(nonZeroValues);
          const maxVal = d3.max(nonZeroValues);

          const scale = d3
            .scaleQuantize()
            .domain([minVal, maxVal])
            .range(colorPalette);

          // 5. Re-color the countries
          mapContainer
            .selectAll("path")
            .transition()
            .duration(200)
            .attr("fill", function (d) {
              if (!d || !d.properties) {
                console.error(d, this);
                return;
              }
              const geoCode = d.properties.EUROSTAT;
              const val = valuesByGeo[geoCode] ?? 0;

              if (val === 0 || isNaN(val)) return "#cccccc"; // Grey for 0/missing
              return scale(val);
            });

          mapContainer
            .selectAll("path")
            .on("mouseover", function (event, d) {
              d3.select(this).raise().style("stroke-width", 0.5);
              const geoCode = d.properties.EUROSTAT;
              const countryName = d.properties.ADMIN;
              const val = valuesByGeo[geoCode] ?? 0;

              const tooltip = d3.select("#map-tooltip");
              tooltip
                .style("display", "block")
                .html(
                  `<strong>${countryName}</strong><br/>Value: ${val || "0"}`
                );
            })
            .on("touchstart", function (event, d) {
              d3.select(this).raise().style("stroke-width", 0.5);
              const geoCode = d.properties.EUROSTAT;
              const countryName = d.properties.ADMIN;
              const val = valuesByGeo[geoCode] ?? 0;

              const tooltip = d3.select("#map-tooltip");
              tooltip
                .style("display", "block")
                .html(
                  `<strong>${countryName}</strong><br/>Value: ${val || "0"}`
                );
            })
            .on("mousemove", function (event) {
              d3.select("#map-tooltip")
                .style("left", event.pageX + "px")
                .style("top", event.pageY - 40 + "px");
            })
            .on("mouseout", function () {
              d3.select(this).style("stroke-width", 0.25);
              d3.select("#map-tooltip").style("display", "none");
            });

          // 6. Update info panel
          const dataset = document.getElementById("dataset-select").value;
          const meta = metadata[dataset];
          const label = meta.label || dataset;
          const description = meta.description || "";
          const shouldShowDescription = description && description !== label;

          d3.select("#info-title").text(label);
          const descContainer = d3.select("#info-description");
          descContainer.html(""); // Clear old

          if (shouldShowDescription) {
            const isLong = description.length > 100;
            const shortText = description.slice(0, 100) + "...";

            descContainer
              .append("span")
              .attr("id", "desc-text")
              .text(isLong ? shortText : description);

            if (isLong) {
              descContainer
                .append("a")
                .attr("href", "#")
                .attr("id", "desc-toggle")
                .style("display", "block")
                .style("color", "#0077cc")
                .style("margin-top", "4px")
                .text("Read more...");

              // Toggle behavior
              d3.select("#desc-toggle").on("click", function (event) {
                event.preventDefault();
                const current = d3.select("#desc-text").text();
                const isExpanded = current === description;

                d3.select("#desc-text").text(
                  isExpanded ? shortText : description
                );
                d3.select(this).text(
                  isExpanded ? "Read more..." : "Read less..."
                );
              });
            }
          }

          // 7. Update color legend
          const legend = d3.select("#color-legend");
          legend.html(""); // Clear previous

          const thresholds = scale.thresholds
            ? scale.thresholds()
            : scale.range().map((_, i, arr) => {
                const step = (maxVal - minVal) / arr.length;
                return minVal + step * i;
              });

          thresholds.forEach((t, i) => {
            const color = colorPalette[i];
            const from = i === 0 ? minVal : thresholds[i - 1];
            const to = t;
            const label =
              from.toFixed(0) === to.toFixed(0)
                ? `${from.toFixed(2)}-${to.toFixed(2)}`
                : `${from.toFixed(0)}-${to.toFixed(0)}`;
            legend
              .append("div")
              .style("display", "flex")
              .style("align-items", "center")
              .style("margin-bottom", "2px").html(`
              <div style="width: 18px; height: 14px; background:${color}; margin-right:6px;"></div>
              <div>${label}</div>
            `);
          });

          legend
            .append("div")
            .style("display", "flex")
            .style("align-items", "center")
            .style("margin-top", "6px")
            .html(
              `<div style="width: 18px; height: 14px; background:#cccccc; margin-right:6px;"></div><div>No data / 0</div>`
            );

          // Update Time Slider
          let sliderContainer = d3.select("#time-slider-container");

          if (nochange) {
            return;
          }
          if (!timeChanged) {
            d3.select("#slider-text-div").text(
              `Showing data for: ${selectedTime}`
            );
            return;
          }
          sliderContainer.html(""); // Clear existing content

          if (hasTime) {
            let times = [...new Set(filteredData.map((d) => d.TIME))];
            times.sort(compareTimes);

            const timeToIndex = Object.fromEntries(times.map((t, i) => [t, i]));

            sliderContainer
              .append("input")
              .attr("type", "range")
              .attr("min", 0)
              .attr("max", times.length - 1)
              .attr("value", times.length - 1)
              .style("width", "100%")
              .on("input", function () {
                const index = +this.value;
                const selectedTime = times[index];
                updateMapColors(selectedTime);
              });

            sliderContainer
              .append("div")
              .attr("id", "slider-text-div")
              .style("text-align", "center")
              .style("font-size", "0.8rem")
              .style("margin-top", "4px")
              .text(
                `Showing data for: ${selectedTime ? selectedTime : latestTime}`
              );
          }
        }
      }

      function showCountryChart(geoCode) {
        const countryName = europe.features.find(
          (f) => f.properties.EUROSTAT === geoCode
        ).properties.ADMIN;

        chartContainer.html("").attr("data-chart-type", "bar"); // Clear previous chart

        const svg = chartContainer
          .append("svg")
          .attr("id", "chart-svg")
          .attr("width", "100%")
          .attr("height", "100%");

        // Add close button
        chartContainer
          .append("button")
          .text("X")
          .classed("chart-close-button", true)
          .on("click", () => {
            currentSelected = null;
            chartedCountries.clear();
            // Remove chart
            chartContainer.html("").attr("data-chart-type", "");
          });

        // Filter the historical data
        const countryData = filteredData
          .filter((d) => d.GEO === geoCode && !isNaN(+d.VALUE))
          .sort((a, b) => compareTimes(a.TIME, b.TIME));

        const chartContainerBoundingRect = chartContainer
          .node()
          .getBoundingClientRect();
        const width = chartContainerBoundingRect.width;
        const height = chartContainerBoundingRect.height;
        const margin = { top: 50, right: 30, bottom: 80, left: 60 };

        const plotWidth = width - margin.left - margin.right;
        const plotHeight = height - margin.top - margin.bottom;

        const g = svg
          .append("g")
          .attr("transform", `translate(${margin.left},${margin.top})`);

        // Scales
        const x = d3
          .scaleBand()
          .domain(countryData.map((d) => d.TIME))
          .range([0, plotWidth])
          .padding(0.1);

        const y = d3
          .scaleLinear()
          .domain([
            d3.min(countryData, (d) => +d.VALUE) || 0,
            d3.max(countryData, (d) => +d.VALUE) || 1,
          ])
          .nice()
          .range([plotHeight, 0]);

        const every = Math.ceil(x.domain().length / 10);
        // Axes
        g.append("g")
          .attr("transform", `translate(0,${plotHeight})`)
          .call(
            d3
              .axisBottom(x)
              .tickValues(x.domain().filter((_, i) => i % every == 0))
          )
          .selectAll("text")
          .attr("transform", "rotate(-45)")
          .style("text-anchor", "end");

        g.append("g").call(d3.axisLeft(y));

        // Axis labels
        g.append("text")
          .attr("x", plotWidth / 2)
          .attr("y", plotHeight + 60)
          .attr("text-anchor", "middle")
          .attr("fill", "black")
          .text(metadata[selectedDataset]?.x || "Year");

        g.append("text")
          .attr("transform", "rotate(-90)")
          .attr("x", -plotHeight / 2)
          .attr("y", -45)
          .attr("text-anchor", "middle")
          .attr("fill", "black")
          .text(metadata[selectedDataset]?.y || "Value");

        // Chart title
        let title = `${countryName} - ${
          metadata[selectedDataset]?.label || ""
        }`;
        if (title.length > 40) {
          title = title.slice(0, 40) + "...";
        }
        svg
          .append("text")
          .attr("x", width / 2)
          .attr("y", 30)
          .attr("text-anchor", "middle")
          .style("font-size", "1.1rem")
          .style("font-weight", "bold")
          .text(title);

        // Bars
        const bars = g
          .selectAll(".bar")
          .data(countryData)
          .enter()
          .append("rect")
          .attr("class", "bar")
          .attr("x", (d) => x(d.TIME))
          .attr("y", (d) => y(+d.VALUE))
          .attr("width", x.bandwidth())
          .attr("height", (d) => plotHeight - y(+d.VALUE))
          .attr("fill", "#4682b4");

        // Tooltip
        const tooltip = d3.select("#chart-tooltip").style("opacity", 0);

        const topOffset = chartContainerBoundingRect.top;
        const leftOffset = chartContainerBoundingRect.left;

        bars
          .on("mouseover", function (event, d) {
            d3.select(this).attr("fill", d3.color("#4682b4").darker(1));
            const bar = d3.select(event.currentTarget);
            console.log(bar.attr("x"), bar.attr("y"));
            const xPos = +bar.attr("x") + x.bandwidth() / 2;
            const yPos = +bar.attr("y");

            tooltip.transition().duration(200).style("opacity", 0.95);
            tooltip.html(`${d.VALUE}`);

            // Position tooltip centered above the bar
            tooltip
              .style(
                "left",
                leftOffset +
                  margin.left +
                  xPos -
                  tooltip.node().offsetWidth / 2 +
                  "px"
              )
              .style("top", topOffset + margin.top + yPos - 30 + "px"); // 30px above bar
          })
          .on("mouseout", function () {
            d3.select(this).attr("fill", "#4682b4");
            tooltip.transition().duration(300).style("opacity", 0);
          });
      }

      function showLineChart(countries) {
        chartContainer.html("").attr("data-chart-type", "line"); // Clear previous chart

        const svg = chartContainer
          .append("svg")
          .attr("width", "100%")
          .attr("height", "100%");

        chartContainer
          .append("button")
          .text("X")
          .classed("chart-close-button", true)
          .on("click", () => {
            currentSelected = null;
            chartedCountries.clear();
            chartContainer.html("").attr("data-chart-type", "");
          });

        const chartContainerBoundingRect = chartContainer
          .node()
          .getBoundingClientRect();
        const width = chartContainerBoundingRect.width;
        const height = chartContainerBoundingRect.height;
        const margin = { top: 50, right: 150, bottom: 80, left: 60 };

        const plotWidth = width - margin.left - margin.right;
        const plotHeight = height - margin.top - margin.bottom;

        const g = svg
          .append("g")
          .attr("transform", `translate(${margin.left},${margin.top})`);

        // Build time domain and country data
        let allTimes = new Set();
        let countrySeries = [];

        countries.forEach((geo) => {
          const rows = filteredData
            .filter((d) => d.GEO === geo && !isNaN(+d.VALUE))
            .map((d) => ({ time: d.TIME, value: +d.VALUE }))
            .sort((a, b) => compareTimes(a.time, b.time));

          rows.forEach((r) => allTimes.add(r.time));

          countrySeries.push({
            geo,
            name: europe.features.find((f) => f.properties.EUROSTAT === geo)
              .properties.ADMIN,
            values: rows,
          });
        });

        const times = Array.from(allTimes).sort(compareTimes);

        // Scales
        const x = d3
          .scaleBand()
          .domain(times)
          .range([0, plotWidth])
          .padding(0.1);

        const y = d3
          .scaleLinear()
          .domain([
            d3.min(countrySeries, (c) => d3.min(c.values, (d) => d.value)) || 0,
            d3.max(countrySeries, (c) => d3.max(c.values, (d) => d.value)) || 1,
          ])
          .nice()
          .range([plotHeight, 0]);

        const color = d3
          .scaleOrdinal()
          .domain(countries)
          .range(d3.schemeCategory10);

        const every = Math.ceil(x.domain().length / 10);
        // Axes
        g.append("g")
          .attr("transform", `translate(0,${plotHeight})`)
          .call(
            d3
              .axisBottom(x)
              .tickValues(x.domain().filter((_, i) => i % every === 0))
          )
          .selectAll("text")
          .attr("transform", "rotate(-45)")
          .style("text-anchor", "end");

        g.append("g").call(d3.axisLeft(y));

        // Axis labels
        g.append("text")
          .attr("x", plotWidth / 2)
          .attr("y", plotHeight + 60)
          .attr("text-anchor", "middle")
          .attr("fill", "black")
          .text(metadata[selectedDataset]?.x || "Year");

        g.append("text")
          .attr("transform", "rotate(-90)")
          .attr("x", -plotHeight / 2)
          .attr("y", -45)
          .attr("text-anchor", "middle")
          .attr("fill", "black")
          .text(metadata[selectedDataset]?.y || "Value");

        // Chart title
        let title = `${metadata[selectedDataset]?.label || ""}`;
        if (title.length > 40) {
          title = title.slice(0, 40) + "...";
        }
        svg
          .append("text")
          .attr("x", width / 2)
          .attr("y", 30)
          .attr("text-anchor", "middle")
          .style("font-size", "1.1rem")
          .style("font-weight", "bold")
          .text(title);

        // Lines
        const line = d3
          .line()
          .x((d) => x(d.time))
          .y((d) => y(d.value));

        g.selectAll(".line")
          .data(countrySeries)
          .enter()
          .append("path")
          .attr("data-country", (d) => d.geo)
          .attr("fill", "none")
          .attr("stroke", (d) => color(d.geo))
          .attr("stroke-width", 2)
          .attr("d", (d) => line(d.values));

        const tooltip = d3.select("#chart-tooltip").style("opacity", 0);

        const leftOffset = chartContainerBoundingRect.left;
        const topOffset = chartContainerBoundingRect.top;

        // Add circles to each data point
        countrySeries.forEach((series) => {
          g.selectAll(`.circle-${series.geo}`)
            .data(series.values)
            .enter()
            .append("circle")
            .attr("data-country", series.geo)
            .attr("cx", (d) => x(d.time))
            .attr("cy", (d) => y(d.value))

            .attr("r", 4)
            .attr("fill", color(series.geo))
            .attr("stroke", "#fff")
            .attr("stroke-width", 1)
            .on("mouseover", function (event, d) {
              tooltip.text(`${series.name} (${d.time}): ${d.value}`);

              const bar = d3.select(event.currentTarget);
              const xPos = +bar.attr("cx") + x.bandwidth() / 2;
              const yPos = +bar.attr("cy");

              tooltip.transition().duration(200).style("opacity", 0.95);

              // Position tooltip centered above the bar
              tooltip
                .style(
                  "left",
                  leftOffset +
                    margin.left +
                    xPos -
                    tooltip.node().offsetWidth / 2 +
                    "px"
                )
                .style("top", topOffset + margin.top + yPos - 30 + "px"); // 30px above bar
            })
            .on("mouseout", function () {
              tooltip.transition().duration(200).style("opacity", 0);
            });
        });

        // Legend
        const legend = svg
          .append("g")
          .attr(
            "transform",
            `translate(${plotWidth + margin.left + 20}, ${margin.top})`
          );

        countrySeries.forEach((d, i) => {
          const group = legend
            .append("g")
            .attr("transform", `translate(0, ${i * 20})`)
            .style("cursor", "pointer")
            .attr("data-country", d.geo);
          group
            .append("rect")
            .attr("width", 12)
            .attr("height", 12)
            .attr("fill", color(d.geo));
          group
            .append("text")
            .attr("x", 16)
            .attr("y", 10)
            .text(d.name)
            .style("font-size", "12px")
            .classed("noselect", true);

          group.on("click", function (e) {
            const elem = d3.select(this);
            const hidden = !elem.classed("strike");
            elem.classed("strike", hidden);
            const geoCode = elem.attr("data-country");
            if (geoCode) {
              // Hide both the line and the circles
              chartContainer
                .selectAll(`path[data-country='${geoCode}']`)
                .classed("hidden", hidden);
              chartContainer
                .selectAll(`circle[data-country='${geoCode}']`)
                .classed("hidden", hidden);
            }
          });
        });
      }

      window.addEventListener("resize", () => {
        resizeMap();

        const svg = d3.select("#map-svg");

        if (window.innerWidth <= 768) {
          svg.selectAll("path").on("click", null);
          return;
        }

        svg.selectAll("path").on("click", function (event, d) {
          const geoCode = d.properties.EUROSTAT;

          if (event.shiftKey) {
            // Toggle country in chartedCountries
            if (chartedCountries.has(geoCode) && chartedCountries.size > 1) {
              chartedCountries.delete(geoCode);
            } else {
              chartedCountries.add(geoCode);
            }

            // Always include currentSelected if any
            if (
              chartContainer.attr("data-chart-type") !== "line" &&
              currentSelected &&
              !chartedCountries.has(currentSelected)
            ) {
              chartedCountries.add(currentSelected);
            }

            if (chartedCountries.size > 0) {
              showLineChart(Array.from(chartedCountries));
            } else {
              chartContainer.html("");
            }
          } else {
            // Normal click resets chartedCountries
            chartedCountries.clear();
            currentSelected = geoCode;
            showCountryChart(geoCode);
          }
        });

        const chartType = chartContainer.attr("data-chart-type");
        if (chartType) {
          if (chartType == "bar") {
            const geoCode = currentSelected;
            if (geoCode) {
              showCountryChart(geoCode);
            }
          } else if (chartType == "line") {
            showLineChart(Array.from(chartedCountries));
          }
        }
      });
    </script>
  </body>
</html>
